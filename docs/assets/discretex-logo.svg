<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Warm Gold and Champagne Gradients -->
    <linearGradient id="gold-x-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="gold-x-reverse" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Subdued Bronze for Outer Cube Framing -->
    <linearGradient id="bronze-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A16207" />
      <stop offset="50%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Translucent Warm Amber/Gold Facet Fills -->
    <linearGradient id="amber-facet-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="amber-facet-side" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400E" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.08" />
    </linearGradient>

    <!-- Radial Golden Ambient Halo -->
    <radialGradient id="gold-glow" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#D97706" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0F0D0A" stop-opacity="0" />
    </radialGradient>

    <!-- High-Luminance Glow Filter for the X -->
    <filter id="x-radiance" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>

    <filter id="center-burst" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="burst" />
      <feComposite in="SourceGraphic" in2="burst" operator="over" />
    </filter>
  </defs>

  <!-- Deep Espresso / Warm Obsidian Background Disc -->
  <circle cx="200" cy="200" r="185" fill="#120E0A" stroke="#2A2016" stroke-width="2.5" />
  <circle cx="200" cy="200" r="160" fill="none" stroke="#423223" stroke-width="1.2" stroke-dasharray="4,8" opacity="0.65" />
  <circle cx="200" cy="200" r="185" fill="url(#gold-glow)" />

  <!-- Translucent Polytope Faces (Subtle Warm Geometry) -->
  <polygon points="200,60 310,135 200,210 90,135" fill="url(#amber-facet-top)" />
  <polygon points="90,135 200,210 200,340 90,265" fill="url(#amber-facet-side)" />
  <polygon points="310,135 200,210 200,340 310,265" fill="url(#amber-facet-top)" />

  <!-- Secondary Lattice Edges (Subdued Warm Brown so X dominates) -->
  <g stroke="#54402E" stroke-width="1.8" opacity="0.55">
    <line x1="200" y1="60" x2="200" y2="210" stroke-dasharray="3,3" />
    <line x1="90" y1="135" x2="310" y2="135" stroke-dasharray="3,3" />
    <line x1="90" y1="265" x2="310" y2="265" stroke-dasharray="3,3" />
  </g>

  <!-- Cube Boundary Struts (Refined Bronze Tone) -->
  <g stroke="url(#bronze-frame)" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="200" y1="60" x2="310" y2="135" />
    <line x1="200" y1="60" x2="90" y2="135" />
    <line x1="90" y1="135" x2="90" y2="265" />
    <line x1="310" y1="135" x2="310" y2="265" />
    <line x1="90" y1="265" x2="200" y2="340" />
    <line x1="310" y1="265" x2="200" y2="340" />
    <line x1="200" y1="210" x2="200" y2="340" stroke="#92400E" stroke-width="2.8" />
  </g>

  <!-- Secondary Lattice Cross-Ties (Beige / Warm Ochre) -->
  <g stroke="#D97706" stroke-width="2" stroke-linecap="round" opacity="0.65">
    <line x1="145" y1="97" x2="255" y2="302" />
    <line x1="255" y1="97" x2="145" y2="302" />
  </g>

  <!-- ======================================================== -->
  <!-- HIGH-VISIBILITY GOLD 'X' PRIMARY BRIDGE STRUCTURE        -->
  <!-- ======================================================== -->
  <!-- Underlying Radiant Soft Shadow / Gold Glow for X -->
  <g stroke="#F59E0B" stroke-width="12" stroke-linecap="round" opacity="0.2" filter="url(#x-radiance)">
    <line x1="90" y1="135" x2="310" y2="265" />
    <line x1="310" y1="135" x2="90" y2="265" />
  </g>

  <!-- The Bold, Prominent Golden 'X' Body -->
  <g stroke-linecap="round" filter="url(#x-radiance)">
    <!-- Diagonal Arm 1: Top-Left to Bottom-Right -->
    <line x1="90" y1="135" x2="200" y2="210" stroke="url(#gold-x-main)" stroke-width="6.5" />
    <line x1="200" y1="210" x2="310" y2="265" stroke="url(#gold-x-main)" stroke-width="6.5" />

    <!-- Diagonal Arm 2: Top-Right to Bottom-Left -->
    <line x1="310" y1="135" x2="200" y2="210" stroke="url(#gold-x-reverse)" stroke-width="6.5" />
    <line x1="200" y1="210" x2="90" y2="265" stroke="url(#gold-x-reverse)" stroke-width="6.5" />
  </g>

  <!-- Inner Core Line Highlights for Crisp Edge Definition -->
  <g stroke="#FFFBEB" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <line x1="94" y1="137" x2="196" y2="208" />
    <line x1="204" y1="212" x2="306" y2="263" />
    <line x1="306" y1="137" x2="204" y2="208" />
    <line x1="196" y1="212" x2="94" y2="263" />
  </g>

  <!-- Lattice Vertices (Nodes) -->
  <!-- Outer Cube Anchors -->
  <circle cx="200" cy="60" r="6" fill="#D97706" stroke="#FEF3C7" stroke-width="2" />
  <circle cx="200" cy="340" r="6" fill="#B45309" stroke="#FEF3C7" stroke-width="2" />

  <!-- Four Primary Endpoints of the Golden X -->
  <circle cx="90" cy="135" r="8" fill="#F59E0B" stroke="#FFFBEB" stroke-width="2.5" filter="url(#x-radiance)" />
  <circle cx="310" cy="135" r="8" fill="#F59E0B" stroke="#FFFBEB" stroke-width="2.5" filter="url(#x-radiance)" />
  <circle cx="90" cy="265" r="8" fill="#D97706" stroke="#FFFBEB" stroke-width="2.5" filter="url(#x-radiance)" />
  <circle cx="310" cy="265" r="8" fill="#D97706" stroke="#FFFBEB" stroke-width="2.5" filter="url(#x-radiance)" />

  <!-- Intermediate Cross-Arm Nodes -->
  <circle cx="145" cy="97" r="4" fill="#FBBF24" opacity="0.8" />
  <circle cx="255" cy="97" r="4" fill="#FBBF24" opacity="0.8" />
  <circle cx="145" cy="302" r="4" fill="#B45309" opacity="0.8" />
  <circle cx="255" cy="302" r="4" fill="#B45309" opacity="0.8" />

  <!-- Central Pivot Vertex (Intersection of the 'X' Bridges) -->
  <circle cx="200" cy="210" r="12" fill="#F59E0B" opacity="0.35" filter="url(#center-burst)" />
  <circle cx="200" cy="210" r="8" fill="#FFFFFF" stroke="#D97706" stroke-width="3" filter="url(#x-radiance)" />
  <circle cx="200" cy="210" r="4" fill="#F59E0B" />
</svg>