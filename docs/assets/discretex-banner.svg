<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="grad-x" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="pill-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.4" />
    </linearGradient>
    <filter id="banner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="ambient-glow" cx="20%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Box -->
  <rect width="1000" height="240" rx="16" fill="url(#banner-bg)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="1000" height="240" rx="16" fill="url(#ambient-glow)" />

  <!-- Subtly Textured Background Grid lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="260" y1="0" x2="260" y2="240" stroke-dasharray="4,8" />
    <line x1="0" y1="120" x2="1000" y2="120" stroke-dasharray="4,8" />
  </g>

  <!-- Left: Emblem / Logo Group scaled and centered around (130, 120) -->
  <g transform="translate(25, 15) scale(0.525)">
    <!-- Polytope Facets -->
    <polygon points="200,60 310,135 200,210 90,135" fill="url(#grad-x)" opacity="0.14" />
    <polygon points="90,135 200,210 200,340 90,265" fill="url(#grad-x)" opacity="0.09" />
    <polygon points="310,135 200,210 200,340 310,265" fill="url(#grad-x)" opacity="0.16" />

    <!-- Structural Edges -->
    <g stroke="#334155" stroke-width="2" opacity="0.7">
      <line x1="200" y1="60" x2="200" y2="210" stroke-dasharray="3,3" />
      <line x1="90" y1="135" x2="310" y2="135" stroke-dasharray="3,3" />
      <line x1="90" y1="265" x2="310" y2="265" stroke-dasharray="3,3" />
    </g>

    <!-- The 'X' Bridges -->
    <g stroke="url(#grad-x)" stroke-width="4.5" stroke-linecap="round" filter="url(#banner-glow)">
      <line x1="90" y1="135" x2="200" y2="210" />
      <line x1="200" y1="210" x2="310" y2="265" />
      <line x1="310" y1="135" x2="200" y2="210" />
      <line x1="200" y1="210" x2="90" y2="265" />

      <line x1="200" y1="60" x2="310" y2="135" stroke-width="3" />
      <line x1="200" y1="60" x2="90" y2="135" stroke-width="3" />
      <line x1="90" y1="135" x2="90" y2="265" stroke-width="3" />
      <line x1="310" y1="135" x2="310" y2="265" stroke-width="3" />
      <line x1="90" y1="265" x2="200" y2="340" stroke-width="3" />
      <line x1="310" y1="265" x2="200" y2="340" stroke-width="3" />
      <line x1="200" y1="210" x2="200" y2="340" stroke-width="3.5" />
    </g>

    <!-- Vertices -->
    <circle cx="200" cy="60" r="6.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="90" cy="135" r="6.5" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="310" cy="135" r="6.5" fill="#818CF8" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="90" cy="265" r="6.5" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="310" cy="265" r="6.5" fill="#A855F7" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="200" cy="340" r="6.5" fill="#6366F1" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="200" cy="210" r="9" fill="#FFFFFF" stroke="#6366F1" stroke-width="3" filter="url(#banner-glow)" />
    <circle cx="200" cy="210" r="4" fill="#38BDF8" />
  </g>

  <!-- Right: Branding & Typography -->
  <g transform="translate(270, 0)">
    <!-- Main Title -->
    <text x="0" y="88" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5" fill="url(#title-grad)">Discrete<tspan fill="#38BDF8">X</tspan></text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="128" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94A3B8" letter-spacing="-0.2">Unified Finite Discrete Mathematics &amp; Algorithmic Structures in ISO C++20</text>

    <!-- Feature Pills / Badges -->
    <g transform="translate(0, 156)">
      <!-- Pill 1: ISO C++20 -->
      <g>
        <rect x="0" y="0" width="98" height="30" rx="6" fill="#1E293B" stroke="url(#pill-border)" stroke-width="1" />
        <circle cx="14" cy="15" r="4" fill="#38BDF8" />
        <text x="26" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">ISO C++20</text>
      </g>
      <!-- Pill 2: Header-Only -->
      <g transform="translate(108, 0)">
        <rect x="0" y="0" width="112" height="30" rx="6" fill="#1E293B" stroke="url(#pill-border)" stroke-width="1" />
        <circle cx="14" cy="15" r="4" fill="#6366F1" />
        <text x="26" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Header-Only</text>
      </g>
      <!-- Pill 3: Zero Dependencies -->
      <g transform="translate(230, 0)">
        <rect x="0" y="0" width="145" height="30" rx="6" fill="#1E293B" stroke="url(#pill-border)" stroke-width="1" />
        <circle cx="14" cy="15" r="4" fill="#10B981" />
        <text x="26" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Zero Dependencies</text>
      </g>
      <!-- Pill 4: Cache-Optimized -->
      <g transform="translate(385, 0)">
        <rect x="0" y="0" width="138" height="30" rx="6" fill="#1E293B" stroke="url(#pill-border)" stroke-width="1" />
        <circle cx="14" cy="15" r="4" fill="#A855F7" />
        <text x="26" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Cache-Optimized</text>
      </g>
      <!-- Pill 5: 9 Bridge Domains -->
      <g transform="translate(533, 0)">
        <rect x="0" y="0" width="132" height="30" rx="6" fill="#1E293B" stroke="url(#pill-border)" stroke-width="1" />
        <circle cx="14" cy="15" r="4" fill="#F59E0B" />
        <text x="26" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">9 Bridge Domains</text>
      </g>
    </g>
  </g>
</svg>