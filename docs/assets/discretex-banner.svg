<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Espresso / Warm Charcoal -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0D0A" />
      <stop offset="50%" stop-color="#18130E" />
      <stop offset="100%" stop-color="#110E0A" />
    </linearGradient>

    <!-- Warm Golden Ambient Halo -->
    <radialGradient id="ambient-gold" cx="22%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.24" />
      <stop offset="55%" stop-color="#92400E" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0F0D0A" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Typography Gradient -->
    <linearGradient id="title-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <linearGradient id="x-text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Gold Gradients for Foreground 'X' Structure -->
    <linearGradient id="emblem-gold-x" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="emblem-bronze-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Pill Border Gradient -->
    <linearGradient id="pill-gold-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.35" />
    </linearGradient>

    <filter id="banner-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="1000" height="240" rx="16" fill="url(#banner-bg)" stroke="#2E2319" stroke-width="1.5" />
  <rect width="1000" height="240" rx="16" fill="url(#ambient-gold)" />

  <!-- Subtle Warm Geometric Grid Lines -->
  <g stroke="#261D15" stroke-width="1" opacity="0.45">
    <line x1="260" y1="0" x2="260" y2="240" stroke-dasharray="4,8" />
    <line x1="0" y1="120" x2="1000" y2="120" stroke-dasharray="4,8" />
  </g>

  <!-- Left: Emblem / Logo Group scaled and centered around (130, 120) -->
  <g transform="translate(25, 15) scale(0.525)">
    <!-- Polytope Facets -->
    <polygon points="200,60 310,135 200,210 90,135" fill="#FDE68A" opacity="0.14" />
    <polygon points="90,135 200,210 200,340 90,265" fill="#92400E" opacity="0.12" />
    <polygon points="310,135 200,210 200,340 310,265" fill="#F59E0B" opacity="0.16" />

    <!-- Subdued Structural Edges -->
    <g stroke="#54402E" stroke-width="1.8" opacity="0.55">
      <line x1="200" y1="60" x2="200" y2="210" stroke-dasharray="3,3" />
      <line x1="90" y1="135" x2="310" y2="135" stroke-dasharray="3,3" />
      <line x1="90" y1="265" x2="310" y2="265" stroke-dasharray="3,3" />
    </g>

    <!-- Outer Frame Struts -->
    <g stroke="url(#emblem-bronze-frame)" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <line x1="200" y1="60" x2="310" y2="135" />
      <line x1="200" y1="60" x2="90" y2="135" />
      <line x1="90" y1="135" x2="90" y2="265" />
      <line x1="310" y1="135" x2="310" y2="265" />
      <line x1="90" y1="265" x2="200" y2="340" />
      <line x1="310" y1="265" x2="200" y2="340" />
      <line x1="200" y1="210" x2="200" y2="340" stroke="#92400E" stroke-width="2.8" />
    </g>

    <!-- Prominent High-Visibility Gold 'X' Structure -->
    <!-- Under-glow -->
    <g stroke="#F59E0B" stroke-width="12" stroke-linecap="round" opacity="0.22" filter="url(#banner-glow)">
      <line x1="90" y1="135" x2="310" y2="265" />
      <line x1="310" y1="135" x2="90" y2="265" />
    </g>

    <!-- Bold X Body -->
    <g stroke="url(#emblem-gold-x)" stroke-width="6.5" stroke-linecap="round" filter="url(#banner-glow)">
      <line x1="90" y1="135" x2="200" y2="210" />
      <line x1="200" y1="210" x2="310" y2="265" />
      <line x1="310" y1="135" x2="200" y2="210" />
      <line x1="200" y1="210" x2="90" y2="265" />
    </g>

    <!-- Inner Crisp Highlight Lines -->
    <g stroke="#FFFBEB" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
      <line x1="94" y1="137" x2="196" y2="208" />
      <line x1="204" y1="212" x2="306" y2="263" />
      <line x1="306" y1="137" x2="204" y2="208" />
      <line x1="196" y1="212" x2="94" y2="263" />
    </g>

    <!-- Vertices -->
    <circle cx="200" cy="60" r="6" fill="#D97706" stroke="#FEF3C7" stroke-width="2" />
    <circle cx="200" cy="340" r="6" fill="#B45309" stroke="#FEF3C7" stroke-width="2" />
    <circle cx="90" cy="135" r="8" fill="#F59E0B" stroke="#FFFBEB" stroke-width="2.5" filter="url(#banner-glow)" />
    <circle cx="310" cy="135" r="8" fill="#F59E0B" stroke="#FFFBEB" stroke-width="2.5" filter="url(#banner-glow)" />
    <circle cx="90" cy="265" r="8" fill="#D97706" stroke="#FFFBEB" stroke-width="2.5" filter="url(#banner-glow)" />
    <circle cx="310" cy="265" r="8" fill="#D97706" stroke="#FFFBEB" stroke-width="2.5" filter="url(#banner-glow)" />
    <circle cx="200" cy="210" r="8.5" fill="#FFFFFF" stroke="#D97706" stroke-width="3" filter="url(#banner-glow)" />
    <circle cx="200" cy="210" r="4" fill="#F59E0B" />
  </g>

  <!-- Right: Branding & Typography -->
  <g transform="translate(270, 0)">
    <!-- Main Title -->
    <text x="0" y="88" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5" fill="url(#title-gold)">Discrete<tspan fill="url(#x-text-grad)">X</tspan></text>
    
    <!-- Subtitle / Tagline (Warm Beige / Parchment) -->
    <text x="0" y="128" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#D6C7B2" letter-spacing="-0.2">Unified Finite Discrete Mathematics &amp; Algorithmic Structures in ISO C++20</text>

    <!-- Feature Pills / Badges (Warm Bronze / Gold Accents) -->
    <g transform="translate(0, 156)">
      <!-- Pill 1: ISO C++20 -->
      <g>
        <rect x="0" y="0" width="98" height="30" rx="6" fill="#1B1510" stroke="url(#pill-gold-border)" stroke-width="1" />
        <circle cx="14" cy="15" r="4" fill="#F59E0B" />
        <text x="26" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F3E8D0">ISO C++20</text>
      </g>
      <!-- Pill 2: Header-Only -->
      <g transform="translate(108, 0)">
        <rect x="0" y="0" width="112" height="30" rx="6" fill="#1B1510" stroke="url(#pill-gold-border)" stroke-width="1" />
        <circle cx="14" cy="15" r="4" fill="#D4AF37" />
        <text x="26" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F3E8D0">Header-Only</text>
      </g>
      <!-- Pill 3: Zero Dependencies -->
      <g transform="translate(230, 0)">
        <rect x="0" y="0" width="145" height="30" rx="6" fill="#1B1510" stroke="url(#pill-gold-border)" stroke-width="1" />
        <circle cx="14" cy="15" r="4" fill="#E5C07B" />
        <text x="26" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F3E8D0">Zero Dependencies</text>
      </g>
      <!-- Pill 4: Cache-Optimized -->
      <g transform="translate(385, 0)">
        <rect x="0" y="0" width="138" height="30" rx="6" fill="#1B1510" stroke="url(#pill-gold-border)" stroke-width="1" />
        <circle cx="14" cy="15" r="4" fill="#FBBF24" />
        <text x="26" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F3E8D0">Cache-Optimized</text>
      </g>
      <!-- Pill 5: 9 Bridge Domains -->
      <g transform="translate(533, 0)">
        <rect x="0" y="0" width="132" height="30" rx="6" fill="#1B1510" stroke="url(#pill-gold-border)" stroke-width="1" />
        <circle cx="14" cy="15" r="4" fill="#D97706" />
        <text x="26" y="20" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F3E8D0">9 Bridge Domains</text>
      </g>
    </g>
  </g>
</svg>